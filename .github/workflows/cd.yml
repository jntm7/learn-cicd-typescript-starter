on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
      
      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'
      
      - name: Set up GCloud SDK
        uses: 'google-github-actions/setup-gcloud@v3'

      - name: Use GCloud CLI
        run: gcloud info

      - name: Build Docker image + Push to Google Artifact Registry
        run: gcloud builds submit --tag us-central1-docker.pkg.dev/notely-510902/notely-ar-repo/notely:latest .
